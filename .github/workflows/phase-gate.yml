# Layer 3 of the review gates (PLAN.md §8a). Runs ONLY when someone with write
# access adds the label `phase-gate` to a PR. Fork PRs get no secrets, so a
# stranger can't spend the key. It comments; it never pushes or merges.
#
# One-time setup (owner): repo Settings → Secrets → Actions → ANTHROPIC_API_KEY.
# Model: Sonnet by default. For the gates PLAN.md §8a marks (Opus), also add the
# label `opus` before `phase-gate`.
name: Phase gate review
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: github.event.label.name == 'phase-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true # TEMP: diagnose first run; remove after
          claude_args: >-
            --model ${{ contains(github.event.pull_request.labels.*.name, 'opus') && 'opus' || 'sonnet' }}
            --max-turns 15
          prompt: |
            You are reviewing PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            It closes one phase (or gate) of PLAN.md. The PR title names the gate (G0..G7).
            You did not write this code. Judge it only against the repo's rules.

            1. Read CLAUDE.md, PLAN.md §0, §8a (find this PR's gate row), and the PLAN sections that row cites.
            2. Read the diff: `git diff origin/${{ github.event.pull_request.base.ref }}...HEAD`.
            3. For each step in the gate, and each item in its checklist column, report
               PASS / FAIL / NOT-VERIFIABLE with file:line evidence.
            Report only defects and unverifiable claims. No style notes and no praise.
            Ignore files whose first line starts with "// SYNCED from" or "// GENERATED from".
            If you run out of turns before checking everything, say "NOT VERIFIED: split the PR". Never guess a pass.

            End with exactly one line the owner can act on:
            VERDICT: MERGE | FIX FIRST (list) | NEEDS A DEVICE TEST (list)
            Post the result as one PR comment.
